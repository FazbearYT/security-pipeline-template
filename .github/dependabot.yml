version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Novosibirsk
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(actions)"

  # Enable only ecosystems that actually exist in the consumer repository.
  # A Dependabot entry without a matching manifest creates noisy failed runs.
