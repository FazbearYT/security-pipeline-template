minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/Yelp/detect-secrets
    # v1.5.0
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        name: detect-secrets staged scan
        args: ["--exclude-files", "^\\.gitleaks\\.toml$"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    # v6.0.0
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # pragma: allowlist secret
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # v0.16.10
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # pragma: allowlist secret
    hooks:
      - id: ruff-check
        args: ["--select", "E,F,W,S,B,UP"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    # v22.1.5
    rev: dd18dad857d6133e90bbe478f4f2f22ec0030269  # pragma: allowlist secret
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: local
    hooks:
      - id: repository-security-contract
        name: Repository security contract
        entry: python scripts/ci/validate_repository.py
        language: system
        pass_filenames: false
        always_run: true
      - id: gofmt
        name: gofmt check
        entry: gofmt -d
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
